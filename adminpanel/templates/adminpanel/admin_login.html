
<!DOCTYPE html>{% load static %}

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Trusty Shop</title>

    <link rel="stylesheet"
          href="{% static 'css/adminLogin.css' %}">

    <!-- Font Awesome --> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" >

</head>

<body>

<div class="admin-login-container">

    <div class="admin-login-card">
        <div class="admin-badge"> <i class="fa-solid fa-shield-halved"></i> Secure Administration </div>
        <h1>Trusty Shop</h1>

        <h2>Admin Login</h2>

        <p>
            Sign in to access the admin panel.
        </p>

        {% if messages %}

            {% for message in messages %}

                <div class="admin-message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    required
                >

            </div>

          <div class="form-group"> <label for="adminPassword"> Password </label> <div class="password-wrapper"> <input id="adminPassword" type="password" name="password" required autocomplete="current-password" placeholder="Enter your password" > <button type="button" class="toggle-password" aria-label="Show password" > <i class="fa-solid fa-eye-slash"></i> </button> </div> </div>

            <button type="submit">
                Admin Login
            </button>

        </form>

    </div>

</div>

<script src="{% static 'js/adminLogin.js' %}"></script>


</body>

</html>
