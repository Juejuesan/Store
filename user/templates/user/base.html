{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#020617">

    <title>
        {% block title %}
        TrustyShop
        {% endblock %}
    </title>


    <!-- =========================================
         GOOGLE FONT
    ========================================== -->

    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">


    <!-- =========================================
         FONT AWESOME
    ========================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


    <!-- =========================================
         AUTH CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="{% static 'user/css/auth.css' %}">

</head>


<body>


    <!-- =========================================
         DJANGO MESSAGES
    ========================================== -->

    {% if messages %}

        <div class="django-messages">

            {% for message in messages %}

                <div class="alert {{ message.tags }}">

                    <i class="fa-solid fa-circle-info"></i>

                    <span>
                        {{ message }}
                    </span>

                    <button
                        type="button"
                        class="alert-close"
                        aria-label="Close">

                        <i class="fa-solid fa-xmark"></i>

                    </button>

                </div>

            {% endfor %}

        </div>

    {% endif %}


    <!-- =========================================
         PAGE CONTENT
    ========================================== -->

    {% block content %}

    {% endblock %}


    <!-- =========================================
         AUTH JAVASCRIPT
    ========================================== -->

    <script
        src="{% static 'user/js/auth.js' %}"
        defer>
    </script>


</body>

</html>
